name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build NSIS Setup EXE
        run: npm run build

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Kisti-Manager-Windows-Installer
          path: dist/*Setup*.exe
          if-no-files-found: error

      - name: Upload all Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Kisti-Manager-Windows-All
          path: dist/*.exe
          if-no-files-found: error
